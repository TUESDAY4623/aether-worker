<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aether Dashboard</title>
  <link rel="stylesheet" href="/css/dashboard.css" />
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <h1>Aether</h1>
        <p class="tagline">Distributed AI</p>
      </div>
      <nav class="nav">
        <a href="#" data-page="overview" class="nav-item active">
          <span class="icon">&#9632;</span> Overview
        </a>
        <a href="#" data-page="workers" class="nav-item">
          <span class="icon">&#9881;</span> Workers
        </a>
        <a href="#" data-page="telemetry" class="nav-item">
          <span class="icon">&#128200;</span> Telemetry
        </a>
        <a href="#" data-page="thermal" class="nav-item">
          <span class="icon">&#127777;</span> Thermal
        </a>
        <a href="#" data-page="models" class="nav-item">
          <span class="icon">&#128218;</span> Models
        </a>
        <a href="#" data-page="accelerators" class="nav-item">
          <span class="icon">&#128187;</span> Accelerators
        </a>
        <a href="#" data-page="resources" class="nav-item">
          <span class="icon">&#128179;</span> Resources
        </a>
        <a href="#" data-page="partitioning" class="nav-item">
          <span class="icon">&#9851;</span> Partitioning
        </a>
        <a href="#" data-page="pipeline" class="nav-item">
          <span class="icon">&#10140;</span> Pipeline
        </a>
        <a href="#" data-page="topology" class="nav-item">
          <span class="icon">&#128506;</span> Topology
        </a>
        <a href="#" data-page="simulation" class="nav-item">
          <span class="icon">&#127922;</span> Simulation
        </a>
        <a href="#" data-page="kv-cache" class="nav-item">
          <span class="icon">&#128451;</span> KV Cache
        </a>
        <a href="#" data-page="healing" class="nav-item">
          <span class="icon">&#128137;</span> Self-Healing
        </a>
        <a href="#" data-page="hierarchy" class="nav-item">
          <span class="icon">&#127759;</span> Hierarchy
        </a>
        <a href="#" data-page="planner" class="nav-item">
          <span class="icon">&#128161;</span> Planner
        </a>
      </nav>
      <div class="sidebar-footer">
        <span id="connection-status" class="status-dot connected" title="Connected"></span>
        <span class="version">v0.1.0</span>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">
      <header class="topbar">
        <h2 id="page-title">Overview</h2>
        <div class="topbar-actions">
          <button id="btn-refresh" title="Refresh">&#8635;</button>
          <label class="toggle">
            <input type="checkbox" id="auto-refresh" checked />
            <span>Auto-refresh (5s)</span>
          </label>
        </div>
      </header>

      <section id="page-content" class="page-content">
        <!-- Dynamic page content loaded here -->
        <div class="loading">Loading...</div>
      </section>
    </main>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
