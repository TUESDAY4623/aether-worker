version: "3.8"

services:
  controller:
    build: .
    container_name: aether-controller
    ports:
      - "8765:8765/tcp"
      - "8766:8766/udp"
      - "8080:8080/tcp"
    environment:
      - AETHER_CONTROLLER_HOST=0.0.0.0
      - AETHER_CONTROLLER_PORT=8765
      - AETHER_DISCOVERY_PORT=8766
      - AETHER_API_ENABLED=true
      - AETHER_API_HOST=0.0.0.0
      - AETHER_API_PORT=8080
      - AETHER_LOG_LEVEL=INFO
    volumes:
      - aether-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  aether-data:
    driver: local
